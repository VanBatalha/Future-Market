<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Future Market</title>
  <meta name="description" content="Tela de propaganda para TV com cache offline e atualização automática." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000 }
    body { font-family: Arial, Helvetica, sans-serif }
    /* Cursor some após 3 s de inatividade */
    body.hide-cursor, body.hide-cursor * { cursor: none !important; }

    #adVideo {
      display: block;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }

    /* ── Overlay "Pressione para iniciar" ── */
    #startOverlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, rgba(0,40,30,.92), rgba(0,0,0,.97));
      cursor: pointer;
      transition: opacity .4s;
    }
    #startOverlay.hidden { opacity: 0; pointer-events: none; }

    .play-ring {
      width: clamp(90px,15vw,140px);
      height: clamp(90px,15vw,140px);
      border-radius: 50%;
      border: 3px solid rgba(0,184,148,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s ease-in-out infinite;
    }
    .play-btn {
      width: clamp(70px,12vw,110px);
      height: clamp(70px,12vw,110px);
      border-radius: 50%;
      background: #00b894;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0,184,148,.5);
    }
    .play-btn::after {
      content: '';
      border-style: solid;
      border-width: clamp(12px,2vw,20px) 0 clamp(12px,2vw,20px) clamp(22px,3.5vw,36px);
      border-color: transparent transparent transparent #fff;
      margin-left: clamp(5px,1vw,10px);
    }
    #startLabel {
      color: rgba(255,255,255,.75);
      font-size: clamp(16px,2.5vw,24px);
      margin-top: 28px;
      letter-spacing: .05em;
    }
    @keyframes pulse {
      0%,100% { transform: scale(1);   opacity: .7; }
      50%      { transform: scale(1.1); opacity: 1;  }
    }

    /* ── Badge discreto: novo vídeo baixado ── */
    #updateBadge {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 100;
      background: rgba(0,184,148,.9);
      color: #fff;
      font-size: 14px;
      padding: 8px 18px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity .5s;
      pointer-events: none;
    }
    #updateBadge.show { opacity: 1; }

    /* ── Tela de erro ── */
    #fallback {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0,0,0,.95);
    }
    #fallback.show { display: flex; }
    .card {
      width: min(720px,100%);
      background: rgba(12,12,12,.9);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 22px;
      padding: clamp(20px,4vw,36px);
      text-align: center;
      color: #fff;
    }
    .card h1 { font-size: clamp(24px,4vw,40px); margin-bottom: 14px }
    .card p  { font-size: clamp(15px,2vw,19px); line-height: 1.55; color: rgba(255,255,255,.8); margin-bottom: 22px }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap }
    .btn {
      min-width: 160px; min-height: 48px;
      padding: 12px 24px; border-radius: 999px; border: 0;
      background: #00b894; color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
    }
    .btn.secondary { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.18); }
  </style>
</head>
<body>

  <video id="adVideo" playsinline webkit-playsinline x5-playsinline preload="auto" poster="./poster.jpg"></video>

  <div id="startOverlay" role="button" tabindex="0" aria-label="Iniciar reprodução">
    <div class="play-ring">
      <button class="play-btn" type="button" aria-label="Play"></button>
    </div>
    <p id="startLabel">Pressione para iniciar</p>
  </div>

  <div id="updateBadge">Novo vídeo pronto — troca ao final…</div>

  <section id="fallback" aria-live="polite">
    <div class="card">
      <h1>Mídia indisponível</h1>
      <p>Verifique a conexão e o arquivo <strong>config.json</strong>. Após a primeira reprodução o conteúdo fica em cache para uso offline.</p>
      <div class="actions">
        <button class="btn"           type="button" id="retryBtn">Tentar novamente</button>
        <button class="btn secondary" type="button" id="reloadBtn">Recarregar página</button>
      </div>
    </div>
  </section>

  <script>
    /* ════════════════════════════════════════════════
       Estado global
    ════════════════════════════════════════════════ */
    const CONFIG_URL  = './config.json';
    const MEDIA_CACHE = 'tv-ads-media-v1';

    const video       = document.getElementById('adVideo');
    const overlay     = document.getElementById('startOverlay');
    const fallback    = document.getElementById('fallback');
    const badge       = document.getElementById('updateBadge');

    let currentConfig   = null;   // config em exibição agora
    let currentBlobUrl  = null;   // blob URL do vídeo em exibição
    let pendingConfig   = null;   // nova config aguardando troca
    let pendingBlobUrl  = null;   // blob URL do novo vídeo (já baixado)
    let refreshTimer    = null;
    let playbackStarted = false;

    /* ════════════════════════════════════════════════
       Fullscreen
    ════════════════════════════════════════════════ */
    function enterFullscreen() {
      const el = document.documentElement;
      const fn = el.requestFullscreen || el.webkitRequestFullscreen
              || el.mozRequestFullScreen || el.msRequestFullscreen;
      if (fn) fn.call(el).catch(() => {});
    }

    ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
      document.addEventListener(ev, () => {
        const inFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
        if (!inFs && playbackStarted) setTimeout(enterFullscreen, 800);
      })
    );

    /* ════════════════════════════════════════════════
       Iniciar reprodução (requer gesto do usuário)
    ════════════════════════════════════════════════ */
    async function startPlayback() {
      if (playbackStarted) return;
      playbackStarted = true;
      overlay.classList.add('hidden');
      enterFullscreen();

      video.muted  = false;
      video.volume = 1;
      try {
        await video.play();
      } catch {
        video.muted = true;
        video.play().catch(() => showFallback());
      }
    }

    overlay.addEventListener('click', startPlayback);

    /* ════════════════════════════════════════════════
       Cursor some após inatividade
    ════════════════════════════════════════════════ */
    let cursorTimer = null;
    function scheduleCursorHide() {
      clearTimeout(cursorTimer);
      document.body.classList.remove('hide-cursor');
      cursorTimer = setTimeout(() => document.body.classList.add('hide-cursor'), 3000);
    }
    document.addEventListener('mousemove', scheduleCursorHide);
    document.addEventListener('touchstart', scheduleCursorHide, { passive: true });
    scheduleCursorHide();   // esconde 3 s após o carregamento se não houver movimento
    document.addEventListener('keydown', e => {
      if (['Enter', ' ', 'ArrowRight', 'MediaPlay', 'MediaPlayPause'].includes(e.key)) {
        e.preventDefault();
        startPlayback();
      }
    });

    /* ════════════════════════════════════════════════
       Gerenciamento de cache de vídeo

       Usamos blob URLs em vez de apontar o <video> para
       a URL real. Assim o browser lê de memória/blob e
       o loop NUNCA faz requisição de rede — sem SW no meio.
    ════════════════════════════════════════════════ */

    /** Chave de cache única por (videoUrl + version) */
    function cacheKey(config) {
      return config.videoUrl + '#v=' + config.version;
    }

    /** Baixa o vídeo (ou usa cache) e devolve um blob URL */
    async function fetchVideoBlob(config) {
      const cache = await caches.open(MEDIA_CACHE);
      const key   = cacheKey(config);

      let response = await cache.match(key);
      if (!response) {
        response = await fetch(config.videoUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        // Armazena no cache para uso offline futuro
        await cache.put(key, response.clone());
      }

      const blob = await response.blob();
      return URL.createObjectURL(blob);
    }

    /** Remove a entrada de um config do cache de mídia */
    async function evictFromCache(config) {
      try {
        const cache = await caches.open(MEDIA_CACHE);
        await cache.delete(cacheKey(config));
      } catch {}
    }

    /* ════════════════════════════════════════════════
       Aplicar vídeo ao elemento
    ════════════════════════════════════════════════ */
    function applyVideo(config, blobUrl) {
      // Libera blob anterior da memória
      if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);

      currentConfig  = config;
      currentBlobUrl = blobUrl;

      // loop=false porque controlamos manualmente via 'ended'
      // (isso garante que a troca aconteça no fim do vídeo)
      video.src          = blobUrl;
      video.loop         = false;
      video.playbackRate = Number(config.playbackRate) || 1;
      video.load();
    }

    /* ════════════════════════════════════════════════
       Loop manual + troca de vídeo ao fim
    ════════════════════════════════════════════════ */
    video.addEventListener('ended', () => {
      if (pendingBlobUrl && pendingConfig) {
        // ── Novo vídeo pronto: troca aqui ──────────────
        const oldConfig = currentConfig;

        applyVideo(pendingConfig, pendingBlobUrl);
        pendingConfig  = null;
        pendingBlobUrl = null;
        badge.classList.remove('show');

        video.play().catch(() => {});

        // Apaga o vídeo antigo do cache após a troca
        evictFromCache(oldConfig);

      } else {
        // ── Mesmo vídeo: loop ───────────────────────────
        video.currentTime = 0;
        video.play().catch(() => {});
      }
    });

    /* ════════════════════════════════════════════════
       Carregamento inicial
    ════════════════════════════════════════════════ */
    async function fetchJson(url) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }

    async function loadInitial() {
      try {
        const config = await fetchJson(CONFIG_URL + '?t=' + Date.now());
        document.title = (config.clientName || 'TV') + ' Ads';

        const blobUrl = await fetchVideoBlob(config);
        applyVideo(config, blobUrl);
        // O play() só acontece quando o usuário pressionar o overlay
        scheduleRefresh(config.refreshMinutes || 15);

      } catch {
        // Tenta config salvo pelo SW
        try {
          const swCache = await caches.open('tv-ads-app-v1');
          const cached  = await swCache.match('./config.json');
          if (cached) {
            const config  = await cached.json();
            document.title = (config.clientName || 'TV') + ' Ads';
            const blobUrl  = await fetchVideoBlob(config);
            applyVideo(config, blobUrl);
            scheduleRefresh(config.refreshMinutes || 15);
            return;
          }
        } catch {}

        // Último recurso: aponta direto (sem cache gerenciado)
        video.src  = './video.mp4';
        video.loop = true;
      }
    }

    /* ════════════════════════════════════════════════
       Verificação periódica de atualizações
    ════════════════════════════════════════════════ */
    function scheduleRefresh(minutes) {
      clearInterval(refreshTimer);
      refreshTimer = setInterval(checkForUpdates, Math.max(1, Number(minutes)) * 60_000);
    }

    async function checkForUpdates() {
      try {
        const fresh = await fetchJson(CONFIG_URL + '?t=' + Date.now());

        // Sem mudança
        if (currentConfig
          && fresh.version  === currentConfig.version
          && fresh.videoUrl === currentConfig.videoUrl) return;

        // Já baixando esta versão
        if (pendingConfig
          && fresh.version  === pendingConfig.version
          && fresh.videoUrl === pendingConfig.videoUrl) return;

        // Nova versão detectada → baixa em background enquanto o atual continua
        pendingConfig  = fresh;
        pendingBlobUrl = null;

        const blobUrl = await fetchVideoBlob(fresh);

        // Confirma que ainda é a versão mais recente (pode ter mudado durante o download)
        if (pendingConfig
          && fresh.version  === pendingConfig.version
          && fresh.videoUrl === pendingConfig.videoUrl) {
          pendingBlobUrl = blobUrl;
          badge.classList.add('show');   // avisa discretamente
        } else {
          URL.revokeObjectURL(blobUrl);  // versão obsoleta, descarta
        }

      } catch {}
    }

    /* ════════════════════════════════════════════════
       Erros e botões de recuperação
    ════════════════════════════════════════════════ */
    function showFallback() { fallback.classList.add('show'); }

    video.addEventListener('error', () => {
      if (playbackStarted) showFallback();
    });

    document.getElementById('retryBtn').addEventListener('click', async () => {
      fallback.classList.remove('show');
      await loadInitial();
      if (playbackStarted) video.play().catch(() => {});
    });
    document.getElementById('reloadBtn').addEventListener('click', () => location.reload());

    window.addEventListener('online', checkForUpdates);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) checkForUpdates();
    });

    /* ════════════════════════════════════════════════
       Service Worker + Bootstrap
    ════════════════════════════════════════════════ */
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    if (location.protocol === 'file:') {
      // Teste local sem servidor
      video.src  = './video.mp4';
      video.loop = true;
    } else {
      loadInitial();
    }
  </script>
</body>
</html>
